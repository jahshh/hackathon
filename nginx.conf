server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback so /terms and /privacy work on refresh and direct URL
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
