apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: response
  labels:
    app: response
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: response
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
