apiVersion: v1
kind: ServiceAccount
metadata:
  name: response
  labels:
    app: response
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: response-pod-reader
  labels:
    app: response
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: response-pod-reader
  labels:
    app: response
subjects:
  - kind: ServiceAccount
    name: response
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: response-pod-reader
