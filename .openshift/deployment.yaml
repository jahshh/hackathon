# OpenShift Deployment Configuration for RESPONSE Application

# This configuration deploys the RESPONSE Emergency Response Command Center
# as a static asset web application on OpenShift

# Application metadata
APPLICATION_NAME: response-command-center
APP_NAME: RESPONSE
DESCRIPTION: Emergency Response Command Center - FORGE demonstration project
VERSION: 1.0.0

# Build configuration
SOURCE_REPOSITORY: https://github.com/example/response-command-center
SOURCE_CONTEXT_DIR: ./
BRANCH: main

# Build strategy - use source-to-image with Node.js
BUILD_STRATEGY: source

# Node.js configuration
NODE_VERSION: 20

# Environment variables
ENVIRONMENT:
  NODE_ENV: production
  VITE_BASE_PATH: "/"
  VITE_API_URL: ""

# Expose the application as a route
KIND: Route
API_VERSION: route.openshift.io/v1
NAME: response-command-center
SPEC:
  host: response-command-center-openshift-default-myproject.apps.oc.example.com
  to:
    kind: Service
    name: response-command-center
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgePolicy: Redirect

# Service definition
KIND: Service
API_VERSION: v1
NAME: response-command-center
SPEC:
  selector:
    app: response-command-center
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080

# Deployment configuration
KIND: Deployment
API_VERSION: apps/v1
NAME: response-command-center
SPEC:
  replicas: 1
  selector:
    matchLabels:
      app: response-command-center
  template:
    metadata:
      labels:
        app: response-command-center
    spec:
      containers:
        - name: nodejs
          image: registry.access.redhat.com/ubi8/nodejs-20:latest
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: indexhtml
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: indexhtml
          configMap:
            name: response-command-center-indexhtml
            items:
              - key: index.html
                path: index.html

# ConfigMap for the HTML file
KIND: ConfigMap
API_VERSION: v1
NAME: response-command-center-indexhtml
DATA:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RESPONSE - Emergency Response Command Center</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/index.css" />
      </head>
      <body>
        <div id="root"></div>
        <script type="module" src="/assets/index.js"></script>
      </body>
    </html>